description: |
  STM32MP1 OTG DWC2 compatible controller.

  The controller is connected to port 1 of the USBPHYC USB HS PHY and is
  clocked by the 48 MHz clock generated by the PHY.

compatible: "st,stm32mp1-hsotg"

include: ["snps,dwc2.yaml", reset-device.yaml]

properties:
  clocks:
    required: true
    description: Bus clock of the controller.

  resets:
    required: true
    description: Reset line of the controller.

  phys:
    required: true
    description: USBPHYC port the controller is connected to.
