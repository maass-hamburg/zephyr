# Common fields for Ethernet devices

include:
  - name: base.yaml
  - name: ethernet-mac-address.yaml

properties:
  phy-handle:
    type: phandle
    dependency-mode: reverse
    description: |
      Specifies a reference to a node representing a PHY device.
      The PHY device depends on the Ethernet device, so the Ethernet
      device is initialized first and can pass its link capabilities
      to the PHY with phy_set_mac_caps().

  phy-connection-type:
    type: string
    description: |
      Specifies the interface connection type between ethernet MAC and PHY.
    enum:
      - "mii"
      - "rmii"
      - "gmii"
      - "rgmii"
      - "rgmii-id"
      - "rgmii-txid"
      - "rgmii-rxid"
      - "tbi"
      - "rtbi"
      - "smii"
      - "sgmii"
      - "rev-mii"
      - "xgmii"
      - "moca"
      - "qsgmii"
      - "trgmii"
      - "internal"

  ptp-clock:
    type: phandle
    description: |
      Corresponding ptp clock device.
