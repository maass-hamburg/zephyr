CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_DNS_RESOLVER=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_INIT_STACKS=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_NET_LOG=y
CONFIG_LOG=y

CONFIG_SLIP_STATISTICS=n
CONFIG_NET_SHELL=y

CONFIG_PHY_LOG_LEVEL_DBG=y
# CONFIG_ETHERNET_LOG_LEVEL_DBG=y
# CONFIG_LOG_MODE_MINIMAL=y

CONFIG_ETH_DWC_ETHER_TX_HW_CHECKSUM=n
CONFIG_ETH_DWC_ETHER_RX_HW_CHECKSUM=n

CONFIG_LOG_BLOCK_IN_THREAD=y
CONFIG_LOG_BUFFER_SIZE=32768
# CONFIG_NET_PKT_LOG_LEVEL_DBG=y
# CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=y
CONFIG_NET_L2_ETHERNET_RESERVE_HEADER=y

# so we use the generic DWC driver
CONFIG_ETH_ESP32=n

